name: Release

# Fires on any `v*` tag push. Runs CI, then creates a GitHub Release
# with auto-generated notes. Libraries don't need a binary artifact —
# SwiftPM consumers build from source — but the release entry surfaces
# notes and gives Swift Package Index a signal to re-index.

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"        # e.g. v1.0.0
          VERSION="${TAG#v}"              # 1.0.0
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            Install via SwiftPM:

            ```swift
            .package(url: "https://github.com/chrischall/swift-mail-automation.git", from: "${{ steps.ver.outputs.version }}"),
            ```

            ```swift
            import MailAutomation
            ```

            See the [README](https://github.com/chrischall/swift-mail-automation#readme) for usage and limitations.
