name: Tag & Bump

# Cut a new release: compute the next SemVer from the latest `v*` tag,
# update the README `from:` pin, commit, tag, and push. Pushing the tag
# triggers release.yml (via RELEASE_PAT — GITHUB_TOKEN pushes don't fire
# downstream workflows).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer level to bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag-and-bump:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # need full tag history
          # PAT required — GITHUB_TOKEN pushes don't trigger release.yml
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: ver
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          CURRENT="${LATEST#v}"
          if [ -z "$CURRENT" ]; then CURRENT="0.0.0"; fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"

          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}"       >> "$GITHUB_OUTPUT"
          echo "::notice title=Release::Bumping ${CURRENT} → ${NEXT}"

      - name: Sync README `from:` pin
        run: |
          sed -i -E 's|(from: ")[0-9]+\.[0-9]+\.[0-9]+(")|\1${{ steps.ver.outputs.next }}\2|' README.md
          git diff --exit-code README.md && echo "README already at target version; nothing to rewrite." || true

      - name: Commit, tag, push
        run: |
          NEXT="${{ steps.ver.outputs.next }}"
          git add README.md
          # Allow empty commit when README was already at target — the tag
          # still needs to land, and an empty release-marker commit is
          # harmless.
          git commit -m "release: ${NEXT}" --allow-empty
          git tag -a "v${NEXT}" -m "v${NEXT}"
          git push origin main
          git push origin "v${NEXT}"
